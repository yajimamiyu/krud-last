apiVersion: apps/v1
kind: Deployment
metadata:
  name: django
spec:
  replicas: 1
  selector:
    matchLabels:
      app: django
  template:
    metadata:
      labels:
        app: django
    spec:
      containers:
      - name: django
        image: myimage/company-system:5
        imagePullPolicy: Never
        command:
        - pipenv
        - run
        - python
        - manage.py
        - runserver
        - 0.0.0.0:8000
        ports:
        - containerPort: 8000

---
apiVersion: v1
kind: Service
metadata:
  name: django-svc
spec:
  type: NodePort
  selector:
    app: django
  ports:
  - port: 8000
    targetPort: 8000